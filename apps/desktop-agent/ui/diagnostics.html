<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kareenos Desktop Agent — Diagnostics</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="brand.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="bar">
    <div class="lockup"><svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="kgm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="0.45" stop-color="#4F46E5"/><stop offset="1" stop-color="#06B6D4"/></linearGradient></defs><rect x="4" y="4" width="56" height="56" rx="18" fill="url(#kgm)"/><path d="M23 19 V45 M41 19 L23 32 M23 32 L42 45" fill="none" stroke="#fff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="wm">kareen<b>os</b></span></div>
    <span class="kick">Diagnostics</span>
    <span class="ver" id="version">…</span>
    <div class="spacer"></div>
    <span class="chip muted" id="chip">…</span>
  </header>
  <main>
    <div class="card">
      <div class="kv" id="kv"></div>
    </div>
    <div class="row">
      <button id="b-logs"><svg viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>Open logs folder</button>
      <button id="b-copy"><svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>Copy diagnostics</button>
      <button id="b-updates"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>Check for updates</button>
      <button id="b-data" class="ghost">Open data folder</button>
      <div class="spacer"></div>
      <button id="b-close" class="ghost">Close</button>
    </div>
    <div id="msg" class="msg hidden"></div>
    <h2>Recent activity</h2>
    <div class="trail" id="trail"></div>
    <p class="muted">The last 80 lines the agent logged; the full log is in the logs folder. Tokens and connection codes are never logged.</p>
  </main>
  <script src="diagnostics.js"></script>
</body>
</html>
