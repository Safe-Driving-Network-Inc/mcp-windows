[package]
name = "kareenos-desktop-agent"
version = "0.1.1"
edition = "2021"
description = "Kareenos Desktop Agent: the Windows half of the Kareenos Desktop Channel (§5.134). Dials out to the Kareenos browser tier and runs the bounded desktop actions through Terminator."
license-file = { workspace = true }
publish = false

[lib]
name = "kareenos_desktop_agent"
path = "src/lib.rs"

[[bin]]
name = "kareenos-desktop-agent"
path = "src/main.rs"

[dependencies]
# The Terminator core only (UIA, trees, screenshots, diff). Never the MCP agent
# crate: no MCP framing, no Sentry/OpenTelemetry/PostHog can come along.
terminator = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4.5", features = ["derive"] }
keyring = { version = "3", features = ["windows-native"] }
hostname = "0.4"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
] }
